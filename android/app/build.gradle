plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.kaiasai.fukura"
    compileSdk 35

    defaultConfig {
        // 旧Android版から同一アプリとして更新し、非公開filesDirの辞書を引き継ぐ。
        applicationId "dev.fsc.snippetexpander"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("FUKURA_UPLOAD_STORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("FUKURA_UPLOAD_STORE_PASSWORD")
                keyAlias System.getenv("FUKURA_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("FUKURA_UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (System.getenv("FUKURA_UPLOAD_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

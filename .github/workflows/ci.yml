name: CI

on:
  push:
  pull_request:

jobs:
  shared:
    name: Shared JSON logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs

  windows-core:
    name: Windows dictionary core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test windows/Fukura.Core.Tests/Fukura.Core.Tests.csproj -c Release --nologo

  windows-app:
    name: Windows app build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build windows/FukuraWindows.csproj -c Release --nologo
      - run: dotnet test windows/Fukura.Core.Tests/Fukura.Core.Tests.csproj -c Release --nologo

  android:
    name: Android unit tests and APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Ensure Android SDK 35
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ]; then
            echo "ANDROID_SDK_ROOT is not set on this runner" >&2
            exit 1
          fi
          sdkmanager="$(find "$sdk_root" -path '*/cmdline-tools/*/bin/sdkmanager' -type f | sort | tail -1)"
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null || true
          "$sdkmanager" --sdk_root="$sdk_root" "platforms;android-35" "build-tools;35.0.0"
      - run: chmod +x android/gradlew
      - run: android/gradlew -p android test assembleDebug assembleRelease --no-daemon

  ios-simulator-screenshots:
    name: iOS Simulator screenshots
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x ci/ios-sim/run-screenshots.sh
      - run: ci/ios-sim/run-screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshots
          path: ci/ios-sim/output
          if-no-files-found: warn

  ios-app:
    name: iOS 1.0 (2) unsigned compile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check frozen iOS version
        run: |
          grep -q '^    MARKETING_VERSION: 1.0$' ios/project.yml
          grep -q '^    CURRENT_PROJECT_VERSION: 2$' ios/project.yml
          ! grep -q 'MARKETING_VERSION: 1.0.0' ios/project.yml
          ! grep -q 'CURRENT_PROJECT_VERSION: 1$' ios/project.yml
      - run: brew install xcodegen
      - run: ios/generate-project.sh
      - run: xcodebuild -project ios/Fukura.xcodeproj -scheme Fukura -destination 'generic/platform=iOS' -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build

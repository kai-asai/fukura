name: Fukura
options:
  bundleIdPrefix: com.kaiasai
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 3
    TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Fukura:
    build:
      targets:
        Fukura: all
        FukuraKeyboard: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  FukuraKeyboard:
    build:
      targets:
        FukuraKeyboard: all
    run:
      config: Debug
targets:
  Fukura:
    type: application
    platform: iOS
    sources:
      - path: FukuraApp
      - path: ../shared/FukuraCore/Sources/FukuraCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.kaiasai.fukura
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: FukuraApp/Fukura.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kaiasai.fukura
    info:
      path: Generated/Fukura-Info.plist
      properties:
        CFBundleDisplayName: fukura
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: FukuraKeyboard
  FukuraKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: FukuraKeyboardExtension
      - path: ../shared/FukuraCore/Sources/FukuraCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaiasai.fukura.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: FukuraKeyboardExtension/FukuraKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kaiasai.fukura
    info:
      path: Generated/FukuraKeyboard-Info.plist
      properties:
        CFBundleDisplayName: Fukura Keyboard
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
          NSExtensionAttributes:
            IsASCIICapable: true
            PrimaryLanguage: ja-JP
            RequestsOpenAccess: false
